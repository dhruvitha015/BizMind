<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BizMind 🧠</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#101828;--mut:#667085;--line:#e4e7ec;--acc:#0e7c66;--accbg:#e3f4ef;--amb:#b7791f;--ambbg:#fdf3dc;--red:#c2410c;--redbg:#fde8df}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Manrope,system-ui,sans-serif}
header{display:flex;gap:24px;align-items:center;padding:14px 28px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px}.logo-mark{font-size:23px;line-height:1}nav{display:flex;gap:4px;flex:1}
nav button{border:0;background:none;padding:8px 14px;border-radius:8px;font:600 14px Manrope;color:var(--mut);cursor:pointer}nav button.on{background:var(--accbg);color:var(--acc)}
main{max-width:1080px;margin:0 auto;padding:28px}
h1{font-size:26px;margin:0 0 4px;font-weight:800}h2{font-size:16px;margin:0 0 12px}.sub{color:var(--mut);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}.grid{display:grid;gap:16px}
.g5{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.big{font-size:30px;font-weight:800}.mut{color:var(--mut);font-size:13px}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 20px}.flow span{background:var(--card);border:1px solid var(--line);padding:6px 12px;border-radius:99px;font-weight:600;font-size:13px}.flow b{color:var(--mut)}
button.p{background:var(--acc);color:#fff;border:0;padding:10px 16px;border-radius:8px;font:600 14px Manrope;cursor:pointer}button.p:disabled{opacity:.5}
button.s{background:var(--card);border:1px solid var(--line);padding:9px 14px;border-radius:8px;font:600 14px Manrope;cursor:pointer}
input,textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
.row{display:flex;gap:8px}.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600}
.won{background:var(--accbg);color:var(--acc)}.lost{background:var(--redbg);color:var(--red)}.pending{background:var(--ambbg);color:var(--amb)}
.meter{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.meter i{display:block;height:100%;background:var(--acc);transition:width 1s}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:16px}.tl div{margin-bottom:14px;position:relative}.tl div:before{content:"";position:absolute;left:-23px;top:6px;width:10px;height:10px;border-radius:9px;background:var(--acc)}
.sec{border-left:3px solid var(--line);padding:2px 12px;margin:10px 0}.sec.r{border-color:var(--acc)}.sec.i{border-color:var(--amb)}.sec.u{border-color:var(--red)}.sec b{font-size:13px}
.sec ul{margin:4px 0;padding-left:18px}details{margin-top:10px}summary{cursor:pointer;color:var(--mut);font-weight:600;font-size:13px}
.item{padding:12px 0;border-top:1px solid var(--line);cursor:pointer}.item:first-child{border:0}
.err{background:var(--redbg);color:var(--red);padding:12px;border-radius:8px}.empty{text-align:center;color:var(--mut);padding:30px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:9px;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}@keyframes sp{to{transform:rotate(360deg)}}
.delta{color:var(--acc);font-weight:800}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>
:root{--bg:#f6f7f5;--card:#fff;--ink:#172521;--mut:#71807a;--line:#e3e9e5;--acc:#087f68;--accbg:#e8f5f0;--glow:rgba(8,127,104,.16)}
body{background:radial-gradient(ellipse at 78% 0%,#e9f5f0 0,transparent 32%),var(--bg);color:var(--ink)}header{padding:14px clamp(18px,5vw,72px);background:rgba(255,255,255,.84);backdrop-filter:blur(16px)}
.logo{font-size:19px;letter-spacing:-.04em}nav{justify-content:flex-end}main{max-width:1200px;padding:42px clamp(18px,5vw,72px) 72px}
nav button:hover,button.s:hover,.quick-chip:hover{background:var(--accbg);color:var(--acc);transform:translateY(-1px)}button,.quick-chip{transition:background .2s,color .2s,transform .2s,box-shadow .2s}
.dashboard{animation:rise .55s ease both}.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(280px,.85fr);gap:36px;align-items:center;padding:18px 0 34px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;color:var(--acc);font-size:12px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;margin-bottom:18px}.eyebrow:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 5px var(--accbg)}
h1{font-size:clamp(38px,5.4vw,64px);line-height:1.05;letter-spacing:-.055em;margin:0 0 18px;max-width:660px}.hero-copy{font-size:16px;line-height:1.8;color:var(--mut);max-width:550px;margin:0}
.memory-visual{position:relative;min-height:270px;display:grid;place-items:center;overflow:hidden;border:1px solid rgba(8,127,104,.12);border-radius:28px;background:linear-gradient(145deg,rgba(255,255,255,.85),rgba(231,245,239,.8));box-shadow:0 22px 60px rgba(25,68,54,.06)}.memory-visual:before,.memory-visual:after{content:"";position:absolute;width:230px;height:230px;border:1px solid rgba(8,127,104,.09);border-radius:50%;animation:orbit 24s linear infinite}.memory-visual:after{width:175px;height:175px;animation-direction:reverse}
.nodes{position:relative;z-index:1;display:grid;gap:13px;width:min(260px,80%)}.node{display:flex;align-items:center;gap:11px;padding:10px 14px;border:1px solid rgba(8,127,104,.12);border-radius:14px;background:rgba(255,255,255,.88);font-size:13px;font-weight:700;box-shadow:0 6px 20px rgba(28,72,58,.045);animation:node-in .65s ease both}.node:nth-child(2){margin-left:12px;animation-delay:.12s}.node:nth-child(3){margin-left:24px;animation-delay:.24s}.node:nth-child(4){margin-left:36px;animation-delay:.36s}.node-icon{display:grid;place-items:center;width:27px;height:27px;border-radius:9px;background:var(--accbg);color:var(--acc);font-size:14px}.node-arrow{position:absolute;left:18px;top:31px;height:calc(100% - 60px);border-left:1px dashed rgba(8,127,104,.3);z-index:-1}
.assistant-panel{margin:0 0 42px;padding:clamp(22px,4vw,38px);border:1px solid rgba(8,127,104,.13);border-radius:24px;background:linear-gradient(130deg,#fff 10%,#f6fbf8 100%);box-shadow:0 18px 55px rgba(30,73,59,.075)}.assistant-panel h2{font-size:23px;letter-spacing:-.035em;margin:0 0 5px}.assistant-hint{color:var(--mut);font-size:13px;margin-bottom:20px}
.ask-shell{display:flex;align-items:center;gap:12px;padding:8px 9px 8px 18px;border:1px solid #dce6e0;border-radius:15px;background:#fff;transition:border-color .25s,box-shadow .25s,transform .25s}.ask-shell:focus-within{border-color:var(--acc);box-shadow:0 0 0 4px var(--glow),0 12px 30px rgba(8,127,104,.08);transform:translateY(-1px)}.ask-shell input{border:0!important;outline:0;box-shadow:none!important;background:transparent;padding:12px 0;min-width:0;font-size:15px}.ask-shell input::placeholder{color:#99a59f}.ask-button{white-space:nowrap;padding:12px 19px!important;border-radius:11px!important;box-shadow:0 5px 12px rgba(8,127,104,.16)}
.quick-row{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:17px}.quick-label{font-size:12px;color:var(--mut);margin-right:3px}.quick-chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;color:#53615b;font:600 12px Manrope;cursor:pointer}.quick-chip:hover{border-color:#cde5da}#ans:empty{display:none}#ans:not(:empty){margin-top:18px}.answer-loading{display:flex;gap:10px;align-items:center;color:var(--mut);font-size:13px;padding:10px 2px}.answer-loading .spin{border-color:#c9e4d9;border-top-color:var(--acc)}
.below-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(270px,.7fr);gap:18px;align-items:stretch}.section-heading{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}.section-heading h2{font-size:17px;margin:0;letter-spacing:-.025em}.section-heading a{color:var(--acc);font-size:12px;font-weight:700;text-decoration:none}.learn-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.learn-card{border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.9);padding:16px;min-width:0;animation:rise .5s ease both;transition:transform .2s,box-shadow .2s}.learn-card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(30,73,59,.08)}.learn-card p{font-size:13px;line-height:1.6;font-weight:700;margin:0 0 17px}.learn-meta{display:flex;justify-content:space-between;gap:8px;color:var(--mut);font-size:11px}.confidence{color:var(--acc);font-weight:800;white-space:nowrap}.learn-empty{grid-column:1/-1;padding:24px;border:1px dashed #cbd9d2;border-radius:16px;color:var(--mut);font-size:13px;line-height:1.7}
.demo-card{position:relative;overflow:hidden;padding:22px;border-radius:20px;background:#172d27;color:#fff;min-height:100%}.demo-card:after{content:"";position:absolute;right:-70px;top:-100px;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,rgba(67,197,153,.22),transparent 70%)}.demo-card>*{position:relative;z-index:1}.demo-kicker{color:#8ad4b8;font-size:10px;font-weight:800;letter-spacing:.12em}.demo-card h2{margin:12px 0 8px;font-size:19px;letter-spacing:-.03em}.demo-card p{color:#b2c5bd;font-size:12px;line-height:1.7;margin:0 0 18px}.demo-card button{background:#fff;color:#164536}
.onboarding{max-width:780px;margin:32px auto;text-align:center;padding:clamp(28px,6vw,60px);border:1px solid var(--line);border-radius:26px;background:rgba(255,255,255,.86);box-shadow:0 22px 60px rgba(30,73,59,.07)}.onboarding h1{font-size:clamp(32px,5vw,48px);margin:15px auto}.onboarding .sub{max-width:470px;margin:0 auto 22px;line-height:1.8}.onboard-icon{font-size:36px}.card{border-radius:16px;box-shadow:0 8px 26px rgba(24,55,44,.035)}.sec ul{line-height:1.8}details[open]{animation:rise .25s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes node-in{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:translateX(0)}}@keyframes orbit{to{transform:rotate(360deg)}}
@media(max-width:780px){main{padding-top:26px}.hero{grid-template-columns:1fr;gap:24px}.memory-visual{min-height:245px}.below-grid{grid-template-columns:1fr}.learn-list{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:540px){header{gap:10px;align-items:flex-start;flex-direction:column;padding:12px 18px}nav{width:100%;justify-content:flex-start;overflow-x:auto}nav button{white-space:nowrap;padding:8px 10px;font-size:12px}main{padding:25px 16px 48px}.hero{padding-top:10px}h1{font-size:40px}.memory-visual{min-height:230px}.assistant-panel{padding:20px 16px;border-radius:19px}.ask-shell{align-items:stretch;gap:7px;padding:6px}.ask-shell input{padding:10px 6px;font-size:13px}.ask-button{padding:10px 12px!important;font-size:12px!important}.quick-row{gap:7px}.quick-label{width:100%}.quick-chip{font-size:11px;padding:7px 9px}.learn-list{grid-template-columns:1fr}.learn-card{padding:15px}.demo-card{min-height:0}}
@media(prefers-reduced-motion:reduce){.dashboard,.node,.learn-card,.memory-visual:before,.memory-visual:after{animation:none!important}button,.quick-chip,.learn-card,.ask-shell{transition:none!important}}
</style></head><body>
<header><div class="logo"><span class="logo-mark" aria-hidden="true">🧠</span><span>BizMind</span></div><nav id="nav"></nav></header>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const api=async(p,o)=>{const r=await fetch('/api'+p,o&&{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});const j=await r.json();if(!r.ok)throw new Error(j.error);return j};
const busy=t=>`<div class="empty"><span class="spin"></span>${t}</div>`,fail=e=>`<div class="err">${esc(e.message)}. Check your API keys in .env and that both services are reachable.</div>`;
const list=(a,e)=>a?.length?`<ul>${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:`<div class="mut">${e||'Nothing'}</div>`;
const badge=d=>`<span class="badge ${d}">${d}</span>`;
let view='dash',cur=null,placeholderTimer=null;
const tabs={dash:'Dashboard',cust:'Businesses',demo:'Before / After',mem:'Memory'};
$('#nav').innerHTML=Object.entries(tabs).map(([k,v])=>`<button data-k="${k}">${v}</button>`).join('');
$('#nav').onclick=e=>{if(e.target.dataset.k)go(e.target.dataset.k)};
function go(k,id){view=k;if(id)cur=id;if(placeholderTimer){clearInterval(placeholderTimer);placeholderTimer=null}document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));({dash,cust,demo,mem})[k]()}

function answerCard(r){return `<div class="card" style="margin-top:16px"><div class="row" style="justify-content:space-between"><h2>${esc(r.answer)}</h2><span class="badge won">${r.confidence}% confident</span></div>
<div class="sec r"><b>Remembered</b>${list(r.remembered,'No stored facts matched.')}</div><div class="sec i"><b>Inferred</b>${list(r.inferred,'No inference made.')}</div><div class="sec u"><b>Unknown</b>${list(r.unknown,'Nothing flagged.')}</div>
<details><summary>Memories retrieved from Hindsight (${r.memories?.length||0})</summary>${list(r.memories?.map(m=>m.text))}</details></div>`}
async function askBox(el,cid){const q=$('#q').value.trim();if(!q){el.innerHTML='<div class="mut" role="status">Enter a question to search memory.</div>';$('#q').focus();return}const states=['Searching memory…','Connecting relevant experiences…','Reasoning from what we learned…'];let n=0;el.innerHTML=`<div class="answer-loading" role="status"><span class="spin"></span><span>${states[0]}</span></div>`;const timer=setInterval(()=>{n=(n+1)%states.length;const label=el.querySelector('.answer-loading span:last-child');if(label)label.textContent=states[n]},1300);try{el.innerHTML=answerCard(await api('/ask',{customerId:cid,question:q}))}catch(e){el.innerHTML=fail(e)}finally{clearInterval(timer)}}
const askUI=(cid,ph,hero=false)=>hero?`<section class="assistant-panel"><h2>What would you like to know?</h2><div class="assistant-hint">Ask across the experiences your business has collected.</div><form id="ask-form"><div class="ask-shell"><input id="q" type="text" placeholder="${esc(ph)}" aria-label="Ask BizMind a question"><button class="p ask-button" id="ab" type="submit">✦ Ask BizMind</button></div></form><div class="quick-row"><span class="quick-label">Try asking</span><button class="quick-chip" data-question="What do we know about this customer?">Understand a customer</button><button class="quick-chip" data-question="What problems keep appearing?">Find a pattern</button><button class="quick-chip" data-question="What worked in similar situations?">Recall what worked</button><button class="quick-chip" data-question="What should we do next?">Suggest next action</button></div><div id="ans"></div></section>`:`<div class="card"><h2>Ask BizMind</h2><form id="ask-form"><div class="row"><input id="q" type="text" placeholder="${esc(ph)}" aria-label="Ask BizMind a question"><button class="p" id="ab" type="submit">Ask</button></div></form><div id="ans"></div></div>`;
const askPrompts=['What do we know about this customer?','What worked in similar situations?','What problems keep appearing?','What should we do next?','What did we learn from previous interactions?','Show me relevant past experiences.'];
function wireAsk(cid,rotate=false){const form=$('#ask-form'),input=$('#q');form.onsubmit=e=>{e.preventDefault();askBox($('#ans'),cid)};document.querySelectorAll('[data-question]').forEach(b=>b.onclick=()=>{input.value=b.dataset.question;form.requestSubmit()});if(placeholderTimer)clearInterval(placeholderTimer);if(rotate){let i=0;placeholderTimer=setInterval(()=>{if(input&&!input.matches(':focus')&&!input.value){i=(i+1)%askPrompts.length;input.placeholder=askPrompts[i]}},3200)}}

async function dash(){const a=$('#app');a.innerHTML=busy('Loading your business memory…');try{const d=await api('/dashboard');
const learns=d.recentBeliefs?.length?d.recentBeliefs.map((b,i)=>`<article class="learn-card" style="animation-delay:${i*90}ms"><p>${esc(b.text)}</p><div class="learn-meta"><span>${b.evidenceCount} supporting experience${b.evidenceCount===1?'':'s'} · ${esc(b.name)}</span><span class="confidence">${b.confidence}%</span></div></article>`).join(''):`<div class="learn-empty">${d.customers?'Your AI is ready to learn. Add an interaction to a business and its emerging patterns will appear here.':'Add your first business experience to start building useful memories.'}</div>`;
a.innerHTML=`<div class="dashboard"><section class="hero"><div><div class="eyebrow">Business memory, made useful</div><h1>Your business remembers.<br>Your AI learns.</h1><p class="hero-copy">Every interaction becomes memory. Every memory helps you make a better next move.</p></div><div class="memory-visual" aria-label="Past experience becomes a better decision"><div class="nodes"><span class="node-arrow"></span><div class="node"><span class="node-icon">↗</span>Past experience</div><div class="node"><span class="node-icon">◉</span>Business memory</div><div class="node"><span class="node-icon">✳</span>Learned pattern</div><div class="node"><span class="node-icon">✓</span>Better decision</div></div></div></section>
${!d.customers?`<section class="onboarding"><div class="onboard-icon">&#129504;</div><h1>Let’s give your AI something to remember.</h1><p class="sub">Add your first business interaction and let the agent start learning. Or explore with sample experiences.</p><button class="p" id="seed">Load Demo Data</button><p class="mut" style="margin:14px 0 0">You can also add a business from the Businesses page.</p></section>`:''}
${askUI(null,'What do we know about this customer?',true)}
<div class="below-grid"><section><div class="section-heading"><h2>Recently learned</h2><a href="#" data-go="mem">Explore memory →</a></div><div class="learn-list">${learns}</div></section><aside class="demo-card"><div class="demo-kicker">THE DIFFERENCE MEMORY MAKES</div><h2>Answers shaped by experience.</h2><p>See the same question answered with and without the context of what your business has already learned.</p><button class="p" id="demo-link">Compare answers&nbsp; →</button></aside></div></div>`;
wireAsk(null,true);$('#demo-link').onclick=()=>go('demo');a.querySelector('[data-go="mem"]').onclick=e=>{e.preventDefault();go('mem')};
const seed=$('#seed');if(seed)seed.onclick=async e=>{e.target.disabled=1;e.target.innerHTML='<span class="spin"></span>Adding sample experiences…';try{await api('/demo/seed',{});dash()}catch(x){a.insertAdjacentHTML('afterbegin',fail(x));e.target.disabled=0;e.target.textContent='Load Demo Data'}}
}catch(e){a.innerHTML=fail(e)}}

async function cust(){const a=$('#app');if(cur)return page();a.innerHTML=busy('Loading…');try{const cs=await api('/customers');
a.innerHTML=`<h1>Customers</h1><p class="sub">Pick one to see its memory, beliefs and next action.</p><div class="grid g2"><div class="card">${cs.length?cs.map(c=>`<div class="item" data-id="${c.id}"><b>${esc(c.name)}</b> ${badge(c.deal)}<div class="mut">${esc(c.industry)} · ${c.interactions} interactions${c.topBelief?` · ${esc(c.topBelief.text)}`:''}</div></div>`).join(''):'<div class="empty">No customers yet. Add one, or load demo data from the dashboard.</div>'}</div>
<div class="card"><h2>New customer</h2><input id="nn" placeholder="Company name"><br><br><input id="ni" placeholder="Industry"><br><br><button class="p" id="nb">Add customer</button></div></div>`;
a.querySelectorAll('.item').forEach(i=>i.onclick=()=>{cur=i.dataset.id;page()});$('#nb').onclick=async()=>{if($('#nn').value.trim()){await api('/customers',{name:$('#nn').value,industry:$('#ni').value});cust()}}}catch(e){a.innerHTML=fail(e)}}

async function page(){const a=$('#app');a.innerHTML=busy('Recalling customer memory…');try{const {customer:c,interactions:its,beliefs:bs}=await api('/customers/'+cur);
const top=[...bs].sort((x,y)=>y.confidence-x.confidence)[0];
a.innerHTML=`<button class="s" id="back">← All customers</button><h1 style="margin-top:12px">${esc(c.name)} ${badge(c.deal)}</h1><p class="sub">${esc(c.industry)} · $${(c.value||0).toLocaleString()} deal</p>
<div class="card" style="border-color:var(--acc);margin-bottom:16px"><div class="mut">AI recommendation (inferred, not a stored fact)</div><h2 style="margin:4px 0">${top?esc(top.next_action):'Log an interaction to get a recommendation'}</h2>${top?`<details open><summary>Why this recommendation?</summary>${bs.map(b=>`<div class="sec r"><b>${esc(b.text)}</b> <span class="badge won">${b.confidence}%</span>${list(b.evidence)}</div>`).join('')}</details>`:''}</div>
<div class="grid g2"><div class="card"><h2>Learned beliefs</h2>${bs.length?bs.map(b=>{const h=b.history,d=h.length>1?h[h.length-1].c-h[h.length-2].c:0;return `<div style="margin-bottom:16px"><div class="row" style="justify-content:space-between"><b>${esc(b.text)}</b><span>${b.confidence}% ${d?`<span class="delta">${d>0?'+':''}${d}</span>`:''}</span></div><div class="meter"><i style="width:${b.confidence}%"></i></div><div class="mut">${h.length} update${h.length>1?'s':''}: ${h.map(x=>x.c).join(' → ')}</div></div>`}).join(''):'<div class="empty">No beliefs yet.</div>'}</div>
<div class="card"><h2>Log interaction</h2><select id="it"><option>call</option><option>email</option><option>meeting</option><option>demo</option><option>proposal</option></select><br><br><textarea id="tx" rows="3" placeholder="What happened? Objections, feedback, signals…"></textarea><br><br><div class="row"><select id="oc"><option value="">No outcome</option><option>won</option><option>lost</option></select><button class="p" id="lg">Save to memory</button></div><div id="lgs"></div></div></div>
<div class="card" style="margin-top:16px"><h2>Timeline</h2>${its.length?`<div class="tl">${its.map(i=>`<div><b>${esc(i.type)}</b> <span class="mut">${i.date.slice(0,10)}</span> ${i.outcome!=='none'?badge(i.outcome):''}<br>${esc(i.text)}<details><summary>Extracted</summary><div class="mut">Objections: ${esc(i.extracted.objections.join('; ')||'none')}<br>Signals: ${esc(i.extracted.buying_signals.join('; ')||'none')}<br>Decision makers: ${esc(i.extracted.decision_makers.join('; ')||'n/a')}</div></details></div>`).join('')}</div>`:'<div class="empty">No interactions yet.</div>'}</div>
<div style="margin-top:16px">${askUI(c.id,`What should I know about ${c.name}?`)}</div>`;
$('#back').onclick=()=>{cur=null;cust()};wireAsk(c.id);
$('#lg').onclick=async e=>{if(!$('#tx').value.trim())return;e.target.disabled=1;$('#lgs').innerHTML=busy('Storing in Hindsight → relearning beliefs…');try{await api(`/customers/${c.id}/interactions`,{type:$('#it').value,text:$('#tx').value,outcome:$('#oc').value});page()}catch(x){$('#lgs').innerHTML=fail(x);e.target.disabled=0}}}catch(e){a.innerHTML=fail(e)}}

async function demo(){const a=$('#app');a.innerHTML=busy('Loading…');try{const cs=await api('/customers');
if(!cs.length){a.innerHTML='<div class="card empty">Load demo data from the Dashboard first.</div>';return}
const acme=cs.find(c=>c.name==='Acme')||cs[0];
a.innerHTML=`<h1>Before / After memory</h1><p class="sub">Same question about ${esc(acme.name)}. One assistant has no memory, the other recalls from Hindsight.</p><button class="p" id="run">Ask: “What should I do next with ${esc(acme.name)}?”</button>
<div class="grid g2" style="margin-top:16px" id="cmp"></div><div id="ev" style="margin-top:16px"></div>`;
$('#run').onclick=async e=>{e.target.disabled=1;$('#cmp').innerHTML=`<div class="card">${busy('Generic answer…')}</div><div class="card">${busy('Recalling…')}</div>`;
try{const r=await api('/demo/compare',{customerId:acme.id});const b0=r.beliefs.map(b=>b.confidence);
$('#cmp').innerHTML=`<div class="card"><span class="badge pending">Before memory</span><p>${esc(r.before)}</p></div><div class="card" style="border-color:var(--acc)"><span class="badge won">After Hindsight recall</span>${answerCard(r.after).replace('class="card" style="margin-top:16px"','')}</div>`;
$('#ev').innerHTML=`<div class="card"><h2>Now add new evidence</h2><p class="mut">Acme signs after the phased pilot. Watch confidence update.</p><button class="p" id="nw">Log new outcome</button><div id="nr"></div></div>`;
$('#nw').onclick=async e=>{e.target.disabled=1;$('#nr').innerHTML=busy('Storing memory and updating beliefs…');try{const n=await api('/demo/new-evidence',{customerId:acme.id});
$('#nr').innerHTML=n.beliefs.map(b=>{const h=b.history,p=h.length>1?h[h.length-2].c:null;return `<div style="margin:14px 0"><b>${esc(b.text)}</b><div class="meter"><i style="width:${p??0}%"></i></div><div class="mut">${p!==null?p+'% → ':''}<span class="delta">${b.confidence}%</span></div></div>`}).join('');setTimeout(()=>document.querySelectorAll('#nr .meter i').forEach((el,i)=>el.style.width=n.beliefs[i].confidence+'%'),60)}catch(x){$('#nr').innerHTML=fail(x)}}
}catch(x){$('#cmp').innerHTML=fail(x)}}}catch(e){a.innerHTML=fail(e)}}

function mem(){$('#app').innerHTML=`<h1>Team memory</h1><p class="sub">Search everything the team has ever learned. It stays when a salesperson leaves.</p><div class="card"><div class="row"><input id="ms" placeholder="e.g. implementation concerns"><button class="p" id="mb">Search</button></div><div id="mr"></div></div>`;
const f=async()=>{const q=$('#ms').value.trim();if(!q)return;$('#mr').innerHTML=busy('Searching Hindsight…');try{const r=await api('/memory/search?q='+encodeURIComponent(q));$('#mr').innerHTML=r.length?r.map(m=>`<div class="item">${esc(m.text)}<div class="mut">${esc(m.type||'memory')}${m.date?' · '+String(m.date).slice(0,10):''}</div></div>`).join(''):'<div class="empty">No matching memories.</div>'}catch(e){$('#mr').innerHTML=fail(e)}};$('#mb').onclick=f;$('#ms').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();f()}}}
go('dash');
</script></body></html>
